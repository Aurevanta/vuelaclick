# Publica la demo estática de la carpeta web/ (no hay paso de compilación)
[build]
  publish = "web"

# Los navegadores piden /favicon.ico por su cuenta: se sirve el SVG de la marca
[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.svg"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Es una demo para el cliente: que no aparezca en buscadores (quitar al lanzar la web real)
    X-Robots-Tag = "noindex, nofollow"
    # 'unsafe-inline' en scripts: hay scripts pequeños en el <head> (tema) y onerror en los logos.
    # Probada con el globo, el QR del billete y Google Fonts sin bloqueos.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
